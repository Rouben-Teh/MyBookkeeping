name: my_bookkeeping
description: A minimal bookkeeping Flutter app skeleton
publish_to: "none"
version: 0.0.1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  intl: ^0.19.0
  flutter_sticky_header: ^0.8.0
  custom_refresh_indicator: ^4.0.0
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  flutter_slidable: ^4.0.3
  fl_chart: ^1.2.0
  fluttertoast: ^9.1.0

dev_dependencies:
  drift_dev: ^2.32.0
  build_runner: ^2.11.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
  #   - assets/bookkeeping.sqlite

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
